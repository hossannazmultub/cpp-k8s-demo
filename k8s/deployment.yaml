apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpp-k8s-demo
  labels:
    app: cpp-k8s-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cpp-k8s-demo
  template:
    metadata:
      labels:
        app: cpp-k8s-demo
    spec:
      containers:
      - name: cpp-app
        image: cpp-k8s-demo:v1
        imagePullPolicy: Never
        resources:
          limits:
            cpu: "100m"
            memory: "64Mi"
          requests:
            cpu: "50m"
            memory: "32Mi"